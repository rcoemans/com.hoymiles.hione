<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #fff; color: #333; margin: 0; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    h2 { font-size: 16px; margin: 24px 0 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .section { margin-bottom: 24px; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
    .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin: 4px 4px 4px 0; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-green { background: #61BA1A; color: #fff; }
    .btn-red { background: #e74c3c; color: #fff; }
    .btn-grey { background: #888; color: #fff; }
    .btn-blue { background: #3498db; color: #fff; }
    .status-bar { padding: 10px 14px; border-radius: 6px; background: #f5f5f5; margin: 10px 0; font-size: 13px; }
    .status-bar.running { background: #e8f5e9; border-left: 3px solid #61BA1A; }
    .status-bar.stopped { background: #fef3e7; border-left: 3px solid #e67e22; }
    .hint { font-size: 11px; color: #888; margin-top: 2px; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 6px; font-size: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row > * { flex: 1; }
  </style>
</head>
<body>
  <h1>Hoymiles HiOne — App Settings</h1>

  <!-- ── Login Test ── -->
  <div class="section">
    <h2>Test Cloud Login</h2>
    <div class="row">
      <div><label>Email</label><input type="email" id="testEmail"></div>
      <div><label>Password</label><input type="password" id="testPassword"></div>
    </div>
    <button class="btn btn-green" onclick="testLogin()" style="margin-top:10px">Test Login</button>
    <div id="loginResult" class="status-bar" style="display:none"></div>
  </div>

  <!-- ── Diagnostics ── -->
  <div class="section">
    <h2>Diagnostics (Modbus / Protobuf)</h2>
    <p class="hint">Collect snapshots from Modbus TCP and Protobuf simultaneously for data correlation analysis.</p>

    <div class="row">
      <div>
        <label>Gateway IP</label>
        <input type="text" id="diagIp" placeholder="192.168.1.100">
      </div>
      <div>
        <label>Interval (sec)</label>
        <input type="number" id="diagInterval" value="60" min="10" max="600">
      </div>
    </div>
    <div class="row" style="margin-top:4px">
      <div>
        <label>DTU Serial</label>
        <input type="text" id="diagDtuSn" placeholder="(optional)">
      </div>
      <div>
        <label>Modbus Unit-ID</label>
        <input type="number" id="diagUnitId" value="1" min="1" max="247">
      </div>
    </div>

    <div style="margin-top: 12px;">
      <button class="btn btn-green" id="btnStart" onclick="startDiag()">Start</button>
      <button class="btn btn-red" id="btnStop" onclick="stopDiag()" disabled>Stop</button>
      <button class="btn btn-blue" id="btnExport" onclick="exportDiag()">Export</button>
      <button class="btn btn-grey" id="btnClear" onclick="clearDiag()">Clear</button>
    </div>

    <div id="diagStatus" class="status-bar stopped">Status: idle</div>
    <pre id="diagOutput" style="display:none"></pre>
  </div>

  <script>
    function showStatus(elId, msg, type) {
      var el = document.getElementById(elId);
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      el.className = 'status-bar ' + (type || '');
    }

    function testLogin() {
      var email = document.getElementById('testEmail').value.trim();
      var pw = document.getElementById('testPassword').value;
      if (!email || !pw) return;
      showStatus('loginResult', 'Logging in...', '');
      Homey.api('POST', '/login', { email: email, password: pw }, function(err, res) {
        if (err) {
          showStatus('loginResult', 'Error: ' + (err.message || err), 'stopped');
          return;
        }
        if (res && res.success) {
          showStatus('loginResult', 'Login successful!', 'running');
        } else {
          showStatus('loginResult', 'Login failed: ' + ((res && res.error) || 'unknown'), 'stopped');
        }
      });
    }

    function startDiag() {
      var ip = document.getElementById('diagIp').value.trim();
      if (!ip) { alert('Please enter a Gateway IP'); return; }
      Homey.api('POST', '/diagnostics/start', {
        gatewayIp: ip,
        intervalMs: parseInt(document.getElementById('diagInterval').value) || 60,
        dtuSn: document.getElementById('diagDtuSn').value.trim() || undefined,
        modbusUnitId: parseInt(document.getElementById('diagUnitId').value) || 1,
      }, function(err) {
        if (err) {
          showStatus('diagStatus', 'Start failed: ' + (err.message || err), 'stopped');
          return;
        }
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
        refreshStatus();
      });
    }

    function stopDiag() {
      Homey.api('POST', '/diagnostics/stop', null, function(err) {
        if (err) {
          showStatus('diagStatus', 'Stop failed: ' + (err.message || err), 'stopped');
          return;
        }
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
        refreshStatus();
      });
    }

    function exportDiag() {
      Homey.api('GET', '/diagnostics/export', function(err, data) {
        if (err) {
          showStatus('diagStatus', 'Export failed: ' + (err.message || err), 'stopped');
          return;
        }
        var json = JSON.stringify(data, null, 2);
        document.getElementById('diagOutput').textContent = json;
        document.getElementById('diagOutput').style.display = 'block';
      });
    }

    function clearDiag() {
      if (!confirm('Clear all collected snapshots?')) return;
      Homey.api('POST', '/diagnostics/clear', null, function(err) {
        if (err) {
          showStatus('diagStatus', 'Clear failed: ' + (err.message || err), 'stopped');
          return;
        }
        document.getElementById('diagOutput').style.display = 'none';
        refreshStatus();
      });
    }

    function refreshStatus() {
      Homey.api('GET', '/diagnostics', function(err, st) {
        if (err || !st) return;
        var running = st.running;
        var count = st.snapshotCount || 0;
        var last = st.lastSnapshot ? new Date(st.lastSnapshot).toLocaleTimeString() : '-';
        showStatus('diagStatus',
          'Status: ' + (running ? 'RUNNING' : 'stopped') +
          ' | Snapshots: ' + count +
          ' | Last: ' + last,
          running ? 'running' : 'stopped'
        );
        document.getElementById('btnStart').disabled = running;
        document.getElementById('btnStop').disabled = !running;
      });
    }

    function onHomeyReady(Homey) {
      Homey.ready();
      refreshStatus();
      setInterval(refreshStatus, 5000);
    }
  </script>
</body>
</html>
