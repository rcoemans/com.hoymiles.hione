<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #fff; color: #333; }
    h2 { margin-bottom: 16px; font-size: 18px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
    .btn-primary { background: #ccc; color: #fff; }
    .btn-primary.active { background: #61BA1A; cursor: pointer; }
    .hint { font-size: 12px; color: #888; margin-top: 4px; }
    .error { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }
    .disclaimer { font-size: 11px; color: #999; margin-top: 16px; line-height: 1.4; }
  </style>
</head>
<body>
  <h2 id="title">Login to S-Miles Cloud</h2>
  <label id="lblEmail">Email</label>
  <input type="email" id="email" placeholder="user@example.com" autocomplete="email">
  <label id="lblPassword">Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  <label id="lblApiUrl">API URL <span class="hint">(optional, default: euapi.hoymiles.com)</span></label>
  <input type="text" id="apiUrl" placeholder="https://euapi.hoymiles.com" value="">
  <p class="error" id="errorMsg"></p>
  <button class="btn btn-primary" id="loginBtn" disabled>
    <span id="btnText">Login</span>
  </button>
  <p class="disclaimer" id="disclaimer">Your credentials are only sent to the official Hoymiles API and stored securely on your Homey.</p>

  <script>
    var _Homey = null;
    var _lang = 'en';

    var i18n = {
      en: { title: 'Login to S-Miles Cloud', email: 'Email', password: 'Password', apiUrl: 'API URL', login: 'Login', logging: 'Logging in...', disclaimer: 'Your credentials are only sent to the official Hoymiles API and stored securely on your Homey.' },
      nl: { title: 'Inloggen bij S-Miles Cloud', email: 'E-mail', password: 'Wachtwoord', apiUrl: 'API URL', login: 'Inloggen', logging: 'Bezig met inloggen...', disclaimer: 'Je inloggegevens worden alleen naar de officiële Hoymiles API gestuurd en veilig op je Homey opgeslagen.' }
    };

    function applyLang() {
      var t = i18n[_lang] || i18n.en;
      document.getElementById('title').textContent = t.title;
      document.getElementById('lblEmail').textContent = t.email;
      document.getElementById('lblPassword').textContent = t.password;
      document.getElementById('btnText').textContent = t.login;
      document.getElementById('disclaimer').textContent = t.disclaimer;
    }

    function checkForm() {
      var emailOk = document.getElementById('email').value.trim().length > 0;
      var passOk = document.getElementById('password').value.length > 0;
      var btn = document.getElementById('loginBtn');
      if (emailOk && passOk) {
        btn.disabled = false;
        btn.classList.add('active');
      } else {
        btn.disabled = true;
        btn.classList.remove('active');
      }
    }

    function doLogin() {
      var btn = document.getElementById('loginBtn');
      var errEl = document.getElementById('errorMsg');
      var t = i18n[_lang] || i18n.en;

      if (btn.disabled) return;
      btn.disabled = true;
      btn.classList.remove('active');
      document.getElementById('btnText').textContent = t.logging;
      errEl.style.display = 'none';

      _Homey.emit('login', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        apiUrl: document.getElementById('apiUrl').value.trim() || undefined
      }, function(err, result) {
        if (err) {
          errEl.textContent = err.message || String(err);
          errEl.style.display = 'block';
          document.getElementById('btnText').textContent = t.login;
          checkForm();
          return;
        }
        if (result && result.success) {
          _Homey.nextView();
        } else {
          errEl.textContent = (result && result.error) || 'Login failed';
          errEl.style.display = 'block';
          document.getElementById('btnText').textContent = t.login;
          checkForm();
        }
      });
    }

    function onHomeyReady(Homey) {
      _Homey = Homey;

      document.getElementById('email').addEventListener('input', checkForm);
      document.getElementById('password').addEventListener('input', checkForm);
      document.getElementById('email').addEventListener('change', checkForm);
      document.getElementById('password').addEventListener('change', checkForm);
      document.getElementById('loginBtn').addEventListener('click', doLogin);

      // Poll for autofill (browsers don't fire input events on autofill)
      setInterval(checkForm, 500);

      Homey.getLanguage(function(err, language) {
        if (!err && language) {
          _lang = language.substring(0, 2);
        }
        applyLang();
      });

      Homey.ready();
    }
  </script>
</body>
</html>
