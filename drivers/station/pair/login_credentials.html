<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; color: #1a1a1a; line-height: 1.5; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    h2 { font-size: 18px; font-weight: 600; }
    .lang-toggle {
      font-size: 11px; font-weight: 600; cursor: pointer; color: #666;
      border: 1px solid #ddd; border-radius: 6px; padding: 4px 10px;
      background: #f5f5f5; transition: all 0.15s;
    }
    .lang-toggle:hover { background: #e8e8e8; color: #333; }
    .disclaimer-card {
      background: #fffbf0; border-radius: 10px; padding: 14px 16px;
      margin-bottom: 18px; font-size: 12px; color: #666; line-height: 1.5;
    }
    .disclaimer-card strong { color: #1a1a1a; }
    label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-top: 14px; }
    input {
      width: 100%; padding: 12px; margin-top: 6px; border: 2px solid #e8e8e8;
      border-radius: 10px; font-size: 15px; transition: border-color 0.2s; outline: none;
    }
    input:focus { border-color: #61BA1A; }
    .btn-primary {
      margin-top: 22px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
      background: #61BA1A; color: white; border: none; border-radius: 10px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #56a717; }
    .btn-primary:active { background: #4c9514; transform: scale(0.99); }
    .btn-primary:disabled { background: #9bd4b3; cursor: wait; }
    .error {
      color: #d32f2f; background: #fef2f2; border-radius: 8px; padding: 10px 14px;
      margin-top: 10px; font-size: 13px; display: none;
    }
    .hint { font-size: 11px; color: #999; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="title">Login to S-Miles Cloud</h2>
    <button class="lang-toggle" id="lang-toggle" onclick="toggleLang()">NL</button>
  </div>

  <div class="disclaimer-card">
    <span id="t-disc">Your credentials are only sent to</span> <strong>hoymiles.com</strong>.
  </div>

  <label><span id="t-email">Email</span>
    <input type="email" id="email" placeholder="you@example.com">
  </label>
  <label><span id="t-password">Password</span>
    <input type="password" id="password">
  </label>
  <label><span id="t-apiUrl">API URL</span> <span class="hint">(optional)</span>
    <input type="text" id="apiUrl" placeholder="https://neapi.hoymiles.com">
  </label>

  <div class="error" id="error"></div>
  <button class="btn-primary" id="loginBtn" onclick="doLogin()">Log in</button>

  <script>
    var i18n = {
      en: {
        title: 'Login to S-Miles Cloud',
        disc: 'Your credentials are only sent to',
        email: 'Email',
        password: 'Password',
        apiUrl: 'API URL',
        login: 'Log in',
        logging: 'Logging in...',
        errorEmpty: 'Please fill in both fields.',
        errorFailed: 'Login failed. Please check your credentials.',
        switchLang: 'NL'
      },
      nl: {
        title: 'Inloggen bij S-Miles Cloud',
        disc: 'Je inloggegevens worden alleen verstuurd naar',
        email: 'E-mailadres',
        password: 'Wachtwoord',
        apiUrl: 'API URL',
        login: 'Inloggen',
        logging: 'Bezig met inloggen...',
        errorEmpty: 'Vul beide velden in.',
        errorFailed: 'Inloggen mislukt. Controleer je gegevens.',
        switchLang: 'EN'
      }
    };

    var _lang = 'en';

    function applyLang() {
      var t = i18n[_lang] || i18n.en;
      document.getElementById('title').textContent = t.title;
      document.getElementById('t-disc').textContent = t.disc;
      document.getElementById('t-email').textContent = t.email;
      document.getElementById('t-password').textContent = t.password;
      document.getElementById('t-apiUrl').textContent = t.apiUrl;
      document.getElementById('loginBtn').textContent = t.login;
      document.getElementById('lang-toggle').textContent = t.switchLang;
    }

    function toggleLang() {
      _lang = _lang === 'en' ? 'nl' : 'en';
      applyLang();
    }

    async function doLogin() {
      var email = document.getElementById('email').value.trim();
      var pass  = document.getElementById('password').value;
      var errEl = document.getElementById('error');
      var btn   = document.getElementById('loginBtn');
      var t = i18n[_lang] || i18n.en;

      errEl.style.display = 'none';

      if (!email || !pass) {
        errEl.textContent = t.errorEmpty;
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = t.logging;

      try {
        var result = await Homey.emit('login', {
          email: email,
          password: pass,
          apiUrl: document.getElementById('apiUrl').value.trim() || undefined
        });
        if (result && (result === true || result.success)) {
          Homey.nextView();
        } else {
          errEl.textContent = (result && result.error) || t.errorFailed;
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = t.login;
        }
      } catch (e) {
        errEl.textContent = (e && e.message) || t.errorFailed;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = t.login;
      }
    }

    // Homey is a global object in pairing pages — use Promises, not callbacks
    Homey.getLanguage().then(function(lang) {
      if (lang) { _lang = lang.substring(0, 2); }
      applyLang();
    }).catch(function() { applyLang(); });

    Homey.ready();
  </script>
</body>
</html>
