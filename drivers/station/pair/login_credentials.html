<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #fff; color: #333; }
    h2 { margin-bottom: 16px; font-size: 18px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
    .btn-primary { background: #ccc; color: #fff; }
    .btn-primary.active { background: #61BA1A; }
    .hint { font-size: 12px; color: #888; margin-top: 4px; }
    .error { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }
    .lang-switch { text-align: right; font-size: 12px; color: #61BA1A; cursor: pointer; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="lang-switch" onclick="toggleLanguage()"><span id="langLabel">NL</span></div>
  <h2 id="title">Login to S-Miles Cloud</h2>
  <label id="lblEmail">Email</label>
  <input type="email" id="email" placeholder="user@example.com" oninput="checkForm()">
  <label id="lblPassword">Password</label>
  <input type="password" id="password" placeholder="••••••••" oninput="checkForm()">
  <label id="lblApiUrl">API URL <span class="hint">(optional)</span></label>
  <input type="text" id="apiUrl" placeholder="https://neapi.hoymiles.com" value="">
  <p class="error" id="errorMsg"></p>
  <button class="btn btn-primary" id="loginBtn" disabled onclick="doLogin()">
    <span id="btnText">Login</span>
  </button>

  <script>
    const i18n = {
      en: { title: 'Login to S-Miles Cloud', email: 'Email', password: 'Password', apiUrl: 'API URL', login: 'Login', logging: 'Logging in...', switchLang: 'NL' },
      nl: { title: 'Inloggen bij S-Miles Cloud', email: 'E-mail', password: 'Wachtwoord', apiUrl: 'API URL', login: 'Inloggen', logging: 'Bezig met inloggen...', switchLang: 'EN' },
    };
    let lang = sessionStorage.getItem('homey_lang') || 'en';

    function applyLang() {
      const t = i18n[lang] || i18n.en;
      document.getElementById('title').textContent = t.title;
      document.getElementById('lblEmail').textContent = t.email;
      document.getElementById('lblPassword').textContent = t.password;
      document.getElementById('lblApiUrl').innerHTML = t.apiUrl + ' <span class="hint">(optional)</span>';
      document.getElementById('btnText').textContent = t.login;
      document.getElementById('langLabel').textContent = t.switchLang;
    }

    function toggleLanguage() {
      lang = lang === 'en' ? 'nl' : 'en';
      sessionStorage.setItem('homey_lang', lang);
      applyLang();
    }

    function checkForm() {
      const ok = document.getElementById('email').value.trim() && document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      btn.disabled = !ok;
      btn.classList.toggle('active', ok);
    }

    async function doLogin() {
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      const t = i18n[lang] || i18n.en;
      btn.disabled = true;
      document.getElementById('btnText').textContent = t.logging;
      errEl.style.display = 'none';

      try {
        const result = await Homey.emit('login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          apiUrl: document.getElementById('apiUrl').value.trim() || undefined,
        });
        if (result && result.success) {
          await Homey.nextView();
        } else {
          errEl.textContent = (result && result.error) || 'Login failed';
          errEl.style.display = 'block';
          document.getElementById('btnText').textContent = t.login;
          checkForm();
        }
      } catch (err) {
        errEl.textContent = err.message || 'Login failed';
        errEl.style.display = 'block';
        document.getElementById('btnText').textContent = t.login;
        checkForm();
      }
    }

    Homey.getLanguage().then(l => {
      if (!sessionStorage.getItem('homey_lang')) { lang = l || 'en'; sessionStorage.setItem('homey_lang', lang); }
      applyLang();
    }).catch(() => applyLang());
  </script>
</body>
</html>
