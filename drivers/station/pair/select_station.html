<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #fff; color: #333; }
    h2 { margin-bottom: 16px; font-size: 18px; }
    .station-list { list-style: none; padding: 0; margin: 0; }
    .station-list li { padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .station-list li:hover { background: #f5f5f5; }
    .station-list li.selected { background: #e8f5e9; border-color: #61BA1A; }
    .station-name { font-weight: 600; font-size: 15px; }
    .station-id { font-size: 12px; color: #888; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
    .btn-primary { background: #ccc; color: #fff; }
    .btn-primary.active { background: #61BA1A; cursor: pointer; }
    .loading { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
  <h2 id="title">Select station</h2>
  <div id="loading" class="loading">Loading stations...</div>
  <ul class="station-list" id="stationList" style="display:none;"></ul>
  <button class="btn btn-primary" id="nextBtn" disabled>
    <span id="btnText">Next</span>
  </button>

  <script>
    var _lang = 'en';
    var selectedId = null;
    var stations = [];

    var i18n = {
      en: { title: 'Select station', loading: 'Loading stations...', next: 'Next', none: 'No stations found' },
      nl: { title: 'Selecteer station', loading: 'Stations laden...', next: 'Volgende', none: 'Geen stations gevonden' }
    };

    function applyLang() {
      var t = i18n[_lang] || i18n.en;
      document.getElementById('title').textContent = t.title;
      document.getElementById('loading').textContent = t.loading;
      document.getElementById('btnText').textContent = t.next;
    }

    function renderStations() {
      var list = document.getElementById('stationList');
      var t = i18n[_lang] || i18n.en;
      list.innerHTML = '';
      if (stations.length === 0) {
        list.innerHTML = '<li>' + t.none + '</li>';
      }
      for (var i = 0; i < stations.length; i++) {
        (function(s) {
          var li = document.createElement('li');
          li.innerHTML = '<div class="station-name">' + (s.name || 'Station') + '</div><div class="station-id">ID: ' + s.id + '</div>';
          li.addEventListener('click', function() {
            selectedId = s.id;
            var items = document.querySelectorAll('.station-list li');
            for (var j = 0; j < items.length; j++) items[j].classList.remove('selected');
            li.classList.add('selected');
            var btn = document.getElementById('nextBtn');
            btn.disabled = false;
            btn.classList.add('active');
          });
          list.appendChild(li);
        })(stations[i]);
      }
      document.getElementById('loading').style.display = 'none';
      list.style.display = 'block';
    }

    async function doNext() {
      if (!selectedId) return;
      await Homey.emit('selectStation', selectedId);
      Homey.nextView();
    }

    document.getElementById('nextBtn').addEventListener('click', doNext);

    Homey.getLanguage().then(function(lang) {
      if (lang) { _lang = lang.substring(0, 2); }
      applyLang();
    }).catch(function() { applyLang(); });

    Homey.emit('getStations').then(function(list) {
      stations = list || [];
      renderStations();
    }).catch(function() {
      stations = [];
      renderStations();
    });

    Homey.ready();
  </script>
</body>
</html>
