<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #fff; color: #333; }
    h2 { margin-bottom: 16px; font-size: 18px; }
    .station-list { list-style: none; padding: 0; margin: 0; }
    .station-list li { padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .station-list li:hover { background: #f5f5f5; }
    .station-list li.selected { background: #e8f5e9; border-color: #61BA1A; }
    .station-name { font-weight: 600; font-size: 15px; }
    .station-id { font-size: 12px; color: #888; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
    .btn-primary { background: #ccc; color: #fff; }
    .btn-primary.active { background: #61BA1A; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .lang-switch { text-align: right; font-size: 12px; color: #61BA1A; cursor: pointer; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="lang-switch" onclick="toggleLanguage()"><span id="langLabel">NL</span></div>
  <h2 id="title">Select station</h2>
  <div id="loading" class="loading">Loading stations...</div>
  <ul class="station-list" id="stationList" style="display:none;"></ul>
  <button class="btn btn-primary" id="nextBtn" disabled onclick="doNext()">
    <span id="btnText">Next</span>
  </button>

  <script>
    const i18n = {
      en: { title: 'Select station', loading: 'Loading stations...', next: 'Next', none: 'No stations found', switchLang: 'NL' },
      nl: { title: 'Selecteer station', loading: 'Stations laden...', next: 'Volgende', none: 'Geen stations gevonden', switchLang: 'EN' },
    };
    let lang = sessionStorage.getItem('homey_lang') || 'en';
    let selectedId = null;
    let stations = [];

    function applyLang() {
      const t = i18n[lang] || i18n.en;
      document.getElementById('title').textContent = t.title;
      document.getElementById('loading').textContent = t.loading;
      document.getElementById('btnText').textContent = t.next;
      document.getElementById('langLabel').textContent = t.switchLang;
    }

    function toggleLanguage() {
      lang = lang === 'en' ? 'nl' : 'en';
      sessionStorage.setItem('homey_lang', lang);
      applyLang();
    }

    function renderStations() {
      const list = document.getElementById('stationList');
      const t = i18n[lang] || i18n.en;
      list.innerHTML = '';
      if (stations.length === 0) {
        list.innerHTML = '<li>' + t.none + '</li>';
      }
      stations.forEach(s => {
        const li = document.createElement('li');
        li.innerHTML = '<div class="station-name">' + (s.name || 'Station') + '</div><div class="station-id">ID: ' + s.id + '</div>';
        li.onclick = () => selectStation(s.id, li);
        list.appendChild(li);
      });
      document.getElementById('loading').style.display = 'none';
      list.style.display = 'block';
    }

    function selectStation(id, li) {
      selectedId = id;
      document.querySelectorAll('.station-list li').forEach(el => el.classList.remove('selected'));
      li.classList.add('selected');
      const btn = document.getElementById('nextBtn');
      btn.disabled = false;
      btn.classList.add('active');
    }

    async function doNext() {
      if (!selectedId) return;
      await Homey.emit('selectStation', selectedId);
      await Homey.nextView();
    }

    Homey.getLanguage().then(l => {
      if (!sessionStorage.getItem('homey_lang')) { lang = l || 'en'; sessionStorage.setItem('homey_lang', lang); }
      applyLang();
    }).catch(() => applyLang());

    Homey.emit('getStations').then(list => {
      stations = list || [];
      renderStations();
    }).catch(() => {
      stations = [];
      renderStations();
    });
  </script>
</body>
</html>
