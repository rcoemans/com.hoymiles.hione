<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- HiOne Station: house + solar panel + battery -->
  <!-- House outline -->
  <polygon points="50,8 92,38 92,92 8,92 8,38" fill="none" stroke="#61BA1A" stroke-width="4" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="41" y="66" width="18" height="26" rx="2" fill="none" stroke="#61BA1A" stroke-width="2.5"/>
  <!-- Solar panel (left roof area) -->
  <rect x="12" y="41" width="30" height="18" rx="2" fill="#61BA1A" opacity="0.85"/>
  <line x1="12" y1="50" x2="42" y2="50" stroke="#fff" stroke-width="1.2"/>
  <line x1="22" y1="41" x2="22" y2="59" stroke="#fff" stroke-width="1.2"/>
  <line x1="32" y1="41" x2="32" y2="59" stroke="#fff" stroke-width="1.2"/>
  <!-- Battery (right side) -->
  <rect x="58" y="43" width="28" height="15" rx="3" fill="none" stroke="#61BA1A" stroke-width="2.5"/>
  <rect x="86" y="48" width="4" height="5" rx="1.5" fill="#61BA1A"/>
  <rect x="60" y="45" width="18" height="11" rx="2" fill="#61BA1A" opacity="0.75"/>
  <!-- Lightning bolt connecting solar to battery -->
  <path d="M50,56 L46,67 L51,67 L47,80 L55,68 L50,68 Z" fill="#61BA1A"/>
</svg>
