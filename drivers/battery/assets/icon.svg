<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- HiOne Battery: battery with charge level and SoC indicator -->
  <!-- Battery body -->
  <rect x="10" y="30" width="72" height="40" rx="6" fill="none" stroke="#61BA1A" stroke-width="4"/>
  <!-- Battery terminal -->
  <rect x="82" y="42" width="8" height="16" rx="3" fill="#61BA1A"/>
  <!-- Charge fill (75%) -->
  <rect x="14" y="34" width="50" height="32" rx="4" fill="#61BA1A" opacity="0.8"/>
  <!-- Level dividers -->
  <line x1="30" y1="34" x2="30" y2="66" stroke="#fff" stroke-width="1.5"/>
  <line x1="47" y1="34" x2="47" y2="66" stroke="#fff" stroke-width="1.5"/>
  <line x1="64" y1="34" x2="64" y2="66" stroke="#fff" stroke-width="1.5"/>
  <!-- Lightning bolt overlay -->
  <path d="M45,38 L39,52 L46,52 L41,70 L55,54 L48,54 Z" fill="#fff" opacity="0.9"/>
</svg>
