<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- HiOne Gateway: router/network device with WiFi arcs -->
  <!-- Device body -->
  <rect x="15" y="52" width="70" height="32" rx="6" fill="none" stroke="#61BA1A" stroke-width="4"/>
  <!-- Status LEDs -->
  <circle cx="28" cy="68" r="4" fill="#61BA1A"/>
  <circle cx="42" cy="68" r="4" fill="#61BA1A" opacity="0.6"/>
  <circle cx="56" cy="68" r="4" fill="#61BA1A" opacity="0.35"/>
  <!-- Antenna -->
  <line x1="75" y1="52" x2="75" y2="30" stroke="#61BA1A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="75" cy="28" r="3" fill="#61BA1A"/>
  <!-- WiFi arcs -->
  <path d="M30,44 Q50,24 70,44" fill="none" stroke="#61BA1A" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M38,50 Q50,38 62,50" fill="none" stroke="#61BA1A" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <!-- Center dot -->
  <circle cx="50" cy="52" r="3.5" fill="#61BA1A"/>
</svg>
