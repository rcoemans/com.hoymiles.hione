<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- HiOne Inverter: solar panel + AC output -->
  <!-- Solar panel frame -->
  <rect x="8" y="8" width="50" height="36" rx="3" fill="none" stroke="#61BA1A" stroke-width="3.5" transform="rotate(-8,33,26)"/>
  <!-- Solar panel cells -->
  <g transform="rotate(-8,33,26)" fill="#61BA1A" opacity="0.75">
    <rect x="11" y="11" width="13" height="11" rx="1"/>
    <rect x="26" y="11" width="13" height="11" rx="1"/>
    <rect x="41" y="11" width="13" height="11" rx="1"/>
    <rect x="11" y="24" width="13" height="11" rx="1"/>
    <rect x="26" y="24" width="13" height="11" rx="1"/>
    <rect x="41" y="24" width="13" height="11" rx="1"/>
  </g>
  <!-- Arrow showing power output -->
  <line x1="58" y1="36" x2="72" y2="50" stroke="#61BA1A" stroke-width="3" stroke-linecap="round"/>
  <polyline points="66,45 72,50 67,56" fill="none" stroke="#61BA1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- AC sine wave output -->
  <path d="M72,72 Q78,60 84,72 Q90,84 96,72" fill="none" stroke="#61BA1A" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="65" y1="72" x2="72" y2="72" stroke="#61BA1A" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="96" y1="72" x2="100" y2="72" stroke="#61BA1A" stroke-width="3.5" stroke-linecap="round"/>
  <text x="4" y="90" font-family="Arial" font-size="10" fill="#61BA1A" font-weight="bold">~AC</text>
</svg>
