<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #fff; color: #333; }
    h2 { margin-bottom: 8px; font-size: 18px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 16px; }
    .station-list { list-style: none; padding: 0; margin: 0; }
    .station-list li { padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s; font-weight: 600; }
    .station-list li:hover { background: #f5f5f5; }
    .station-list li.selected { background: #e8f5e9; border-color: #61BA1A; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; background: #ccc; color: #fff; }
    .btn.active { background: #61BA1A; }
    .loading { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
  <h2>Select parent station</h2>
  <p class="subtitle">Choose the station this device belongs to.</p>
  <div id="loading" class="loading">Loading stations...</div>
  <ul class="station-list" id="stationList" style="display:none;"></ul>
  <button class="btn" id="nextBtn" disabled onclick="doNext()">Next</button>

  <script>
    let selectedId = null;
    let stations = [];

    function render() {
      const list = document.getElementById('stationList');
      list.innerHTML = '';
      if (stations.length === 0) {
        list.innerHTML = '<li>No stations found. Please add a station first.</li>';
      }
      stations.forEach(s => {
        const li = document.createElement('li');
        li.textContent = s.name || 'Station ' + s.plantId;
        li.onclick = () => {
          selectedId = s.id;
          document.querySelectorAll('.station-list li').forEach(el => el.classList.remove('selected'));
          li.classList.add('selected');
          const btn = document.getElementById('nextBtn');
          btn.disabled = false;
          btn.classList.add('active');
        };
        list.appendChild(li);
      });
      document.getElementById('loading').style.display = 'none';
      list.style.display = 'block';
    }

    async function doNext() {
      if (!selectedId) return;
      await Homey.emit('selectParent', selectedId);
      await Homey.nextView();
    }

    Homey.emit('getStationDevices').then(list => {
      stations = list || [];
      render();
    }).catch(() => { stations = []; render(); });
  </script>
</body>
</html>
